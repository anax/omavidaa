<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omarchy TV // Mobile Remote</title>
<style>
  :root {
    --bg: #1a1b26; --bg-alt: #16161e; --bg-panel: rgba(26, 27, 38, 0.95);
    --fg: #c0caf5; --muted: #565f89; --accent: #7aa2f7; --accent2: #bb9af7;
    --green: #9ece6a; --amber: #e0af68; --red: #f7768e; --cyan: #7dcfff; --border: #292e42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    width: 100vw; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace;
    display: flex; flex-direction: column; align-items: center; padding: 12px 14px 24px;
  }
  .header {
    width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .distro-pill {
    background: var(--accent); color: #111; font-weight: 800;
    padding: 4px 10px; border-radius: 4px; font-size: 12px; letter-spacing: 0.5px;
  }
  .conn-status { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .section-title {
    width: 100%; max-width: 420px; font-size: 11px; font-weight: 700;
    color: var(--muted); letter-spacing: 0.5px; margin-bottom: 8px; text-transform: uppercase;
  }

  /* EXTENDED SCREEN TOGGLES */
  .screen-toggles {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .screen-btn {
    background: var(--bg-alt); border: 1.5px solid var(--border); color: var(--fg);
    padding: 10px 4px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  }
  .screen-btn:active { background: rgba(122, 162, 247, 0.2); border-color: var(--accent); }

  /* D-PAD WHEEL */
  .dpad-container {
    width: 220px; height: 220px; position: relative; margin: 8px auto 14px;
    background: #111218; border-radius: 50%; border: 3px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  }
  .dpad-btn {
    position: absolute; background: var(--bg-alt); color: var(--fg);
    border: 1px solid var(--border); font-size: 16px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .dpad-btn:active { background: var(--accent); color: #111; }
  .dpad-up { top: 8px; left: 75px; width: 70px; height: 55px; border-radius: 12px 12px 4px 4px; }
  .dpad-down { bottom: 8px; left: 75px; width: 70px; height: 55px; border-radius: 4px 4px 12px 12px; }
  .dpad-left { top: 75px; left: 8px; width: 55px; height: 70px; border-radius: 12px 4px 4px 12px; }
  .dpad-right { top: 75px; right: 8px; width: 55px; height: 70px; border-radius: 4px 12px 12px 4px; }
  .dpad-center {
    width: 68px; height: 68px; border-radius: 50%; background: #1a1b26;
    border: 2px solid var(--accent); color: var(--cyan); font-size: 14px; font-weight: 800;
    box-shadow: 0 0 12px rgba(122,162,247,0.25);
  }

  /* SYSTEM BUTTONS ROW */
  .sys-row {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .sys-btn {
    background: var(--bg-alt); border: 1px solid var(--border); color: var(--fg);
    padding: 10px 6px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
    text-align: center;
  }
  .sys-btn:active { background: rgba(122, 162, 247, 0.2); border-color: var(--accent); }
  .btn-back { border-color: var(--red); color: var(--red); }
  .btn-back:active { background: var(--red); color: #fff; }

  /* HARDWARE CONTROLS */
  .hal-grid {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
  }
  .hal-card {
    background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .hal-label { font-size: 11px; color: var(--amber); font-weight: bold; }
  .hal-btn-row { display: flex; gap: 4px; }
  .hal-btn {
    flex: 1; background: #0d0e14; border: 1px solid var(--border); color: var(--fg);
    padding: 6px 0; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .hal-btn:active { background: var(--accent); color: #111; }

  /* SEARCH / URL INPUT */
  .input-section {
    width: 100%; max-width: 420px; display: flex; gap: 6px; margin-bottom: 14px;
  }
  .input-box {
    flex: 1; background: #0d0e14; border: 1px solid var(--border); color: #fff;
    padding: 9px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none;
  }
  .input-box:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent); color: #111; font-weight: 800; border: none;
    padding: 0 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }

  /* APP LAUNCHER PILLS */
  .apps-grid {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 14px;
  }
  .app-pill {
    background: var(--bg-alt); border: 1px solid var(--border); color: var(--fg);
    padding: 9px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 7px; text-align: left;
  }
  .app-pill:active { background: rgba(122, 162, 247, 0.2); border-color: var(--accent); }

  .feedback-toast {
    position: fixed; bottom: 10px; background: rgba(0,0,0,0.85); color: var(--cyan);
    border: 1px solid var(--cyan); padding: 5px 12px; border-radius: 14px; font-size: 11px;
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  .feedback-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="distro-pill">OMARCHY</span>
    <b style="font-size:14px;color:var(--cyan)">TV REMOTE</b>
  </div>
  <div class="conn-status"><span class="dot"></span> CONNECTED</div>
</div>

<!-- 1. EXTENDED SCREEN & MULTI-WINDOW CONTROLS -->
<div class="section-title">Extended Screen &amp; Tiling</div>
<div class="screen-toggles">
  <button class="screen-btn" onclick="sendAction('screen_split')">
    <span style="font-size:16px;">🪟</span>
    <span>Dual Split 50/50</span>
  </button>
  <button class="screen-btn" onclick="sendAction('screen_pip')">
    <span style="font-size:16px;">🖼️</span>
    <span>Floating PiP</span>
  </button>
  <button class="screen-btn" onclick="sendAction('screen_single')">
    <span style="font-size:16px;">🖥️</span>
    <span>Single Screen</span>
  </button>
</div>

<!-- 2. TOUCH D-PAD WHEEL -->
<div class="section-title" style="text-align:center;">D-Pad Navigation</div>
<div class="dpad-container">
  <button class="dpad-btn dpad-up" onclick="sendKey(38, 'UP')">▲</button>
  <button class="dpad-btn dpad-down" onclick="sendKey(40, 'DOWN')">▼</button>
  <button class="dpad-btn dpad-left" onclick="sendKey(37, 'LEFT')">◀</button>
  <button class="dpad-btn dpad-right" onclick="sendKey(39, 'RIGHT')">▶</button>
  <button class="dpad-btn dpad-center" onclick="sendKey(13, 'OK')">OK</button>
</div>

<!-- 3. ESSENTIAL SYSTEM CONTROLS -->
<div class="sys-row">
  <button class="sys-btn btn-back" onclick="sendKey(461, 'BACK')">◀ Return</button>
  <button class="sys-btn" onclick="sendKey(404, 'GREEN')">⛶ Fullscreen</button>
  <button class="sys-btn" onclick="sendKey(403, 'RED')">🏠 Dock (1)</button>
  <button class="sys-btn" onclick="sendKey(48, 'THEME')">🎨 Theme (0)</button>
</div>

<!-- 4. SEND TEXT OR URL TO TV -->
<div class="section-title">Send to TV Screen</div>
<div class="input-section">
  <input id="tv-text-input" class="input-box" placeholder="Type URL or search query...">
  <button class="send-btn" onclick="sendInputToTv()">Send</button>
</div>

<!-- 5. QUICK APP LAUNCHERS -->
<div class="section-title">Quick Launchers</div>
<div class="apps-grid">
  <button class="app-pill" onclick="launchUrl('https://fis.com.mv', 'Flight Info (FIS)')">✈️ Flight Info (FIS)</button>
  <button class="app-pill" onclick="launchUrl('https://www.youtube.com/tv', 'YouTube TV')">📺 YouTube TV 4K</button>
  <button class="app-pill" onclick="launchUrl('https://m.youtube.com', 'YouTube Web')">▶ YouTube Web</button>
  <button class="app-pill" onclick="launchUrl('https://www.google.com', 'Google Search')">🔍 Google Search</button>
  <button class="app-pill" onclick="launchUrl('https://news.ycombinator.com', 'Hacker News')">⚡ Hacker News</button>
  <button class="app-pill" onclick="launchUrl('https://en.m.wikipedia.org', 'Wikipedia')">📖 Wikipedia</button>
</div>

<!-- 6. HARDWARE HAL CONTROLS -->
<div class="section-title">Hardware Direct Write</div>
<div class="hal-grid">
  <div class="hal-card">
    <div class="hal-label">Backlight Brightness</div>
    <div class="hal-btn-row">
      <button class="hal-btn" onclick="sendHal('brightness', -10)">-10%</button>
      <button class="hal-btn" onclick="sendHal('brightness', 10)">+10%</button>
      <button class="hal-btn" onclick="sendHal('brightness_preset', 50)">50%</button>
      <button class="hal-btn" onclick="sendHal('brightness_preset', 80)">80%</button>
    </div>
  </div>
  <div class="hal-card">
    <div class="hal-label">Audio Volume</div>
    <div class="hal-btn-row">
      <button class="hal-btn" onclick="sendHal('volume', -2)">-2</button>
      <button class="hal-btn" onclick="sendHal('volume', 2)">+2</button>
      <button class="hal-btn" onclick="sendHal('mute', 0)">Mute</button>
    </div>
  </div>
</div>

<div class="feedback-toast" id="toast">Sent</div>

<script>
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(20);
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 800);
}

function postCommand(cmdObj) {
  vibrate();
  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/remote_command", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.send(JSON.stringify(cmdObj));
}

function sendKey(kc, name) {
  showToast(name);
  postCommand({ type: "key", keyCode: kc, name: name });
}

function sendAction(action) {
  showToast(action.replace('_', ' ').toUpperCase());
  postCommand({ type: "action", action: action });
}

function sendHal(param, val) {
  showToast(param + ": " + val);
  postCommand({ type: "hal", param: param, val: val });
}

function launchUrl(url, title) {
  showToast("Launching " + title);
  postCommand({ type: "launch", url: url, title: title });
}

function sendInputToTv() {
  var input = document.getElementById("tv-text-input");
  var val = (input.value || "").trim();
  if (!val) return;
  showToast("Sent: " + val.slice(0, 16));
  postCommand({ type: "browse", url: val });
  input.value = "";
  input.blur();
}

document.getElementById("tv-text-input").addEventListener("keydown", function(e) {
  if (e.keyCode === 13) sendInputToTv();
});
</script>
</body>
</html>
